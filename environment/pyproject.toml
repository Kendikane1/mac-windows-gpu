[project]
name = "mac-windows-gpu-environment"
version = "0.1.0"
description = "Minimal native Windows CUDA and authenticated Jupyter environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.13.0",
    "jupyterlab==4.6.3",
    "ipykernel==7.3.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
